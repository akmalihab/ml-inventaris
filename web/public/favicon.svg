<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="siart-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#siart-grad)" filter="url(#shadow)" />
  <!-- Vertical arm -->
  <rect x="44" y="24" width="12" height="52" rx="6" fill="#ffffff" />
  <!-- Horizontal arm -->
  <rect x="24" y="44" width="52" height="12" rx="6" fill="#ffffff" />
  <!-- Emerald Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="#10b981" />
</svg>
